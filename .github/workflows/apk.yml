name: Build APK

# 上游自带的 release.yml / beta-pack.yml 只在 master / beta 上触发，且会引用
# KEYSTORE_* secrets —— 本 fork 没有这些 secrets，base64 解码空字符串会写出一个
# 名叫 app/ 的垃圾文件并让构建失败。所以这里用一份不依赖任何 secret 的构建流程。
on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 协议层的单测。单独一个 job 且不装依赖，因此只要几秒就能给出反馈 ——
  # APK 构建要 8 分钟左右，让明显的错误排在它前面失败。
  unit-test:
    name: Protocol unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 需要 Node 22.6+ 才能直接运行 .ts（类型擦除）；本仓库本地用 24。
          # 这与下面 apk job 的 Node 20 是刻意的差别，两者互不影响。
          node-version: '24'

      - name: Run protocol unit tests
        # 不需要 npm ci：被测模块刻意做成零依赖（不 import react-native），
        # 测试脚本还给 Node 补了一个把无扩展名导入解析到 .ts 的钩子。
        run: npm test

  apk:
    name: Build universal APK
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 上游 .nvmrc 固定 Node 18（已 EOL）；20 与 RN 0.73 的工具链兼容。
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        env:
          # 上游的构建流程都设了这个开关，保持一致。
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          # 不加任何 -PMYAPP_* 参数：此时 app/build.gradle 会回落到 debug 签名，
          # 产出可安装的 APK。正式分发需要自己的 keystore，见 README。
          ./gradlew assembleRelease --no-daemon

      - name: Show produced APKs
        shell: bash
        run: |
          ls -la android/app/build/outputs/apk/release/ || true

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: anylisten-lx-universal-apk
          path: android/app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: error
          retention-days: 30
